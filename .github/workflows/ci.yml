name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.3", enable-cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm}
      - run: uv sync --frozen
      - run: npm ci
      - run: make lint typecheck test-offline frontend-build
      - run: docker build -t trial-opt:ci .

