name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.3", enable-cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm}
      - run: uv sync --frozen
      - run: npm ci
      - run: make lint typecheck test-offline frontend-build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Preserve Linux Playwright results for baseline review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-playwright-results-v3
          path: frontend/test-results
          retention-days: 1
      - run: docker build -t trial-opt:ci .
